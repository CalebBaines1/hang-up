#cloud-config
# Paste into "User data" when creating a VM (Ubuntu 22.04/24.04). It installs
# Docker, downloads Hang Up, builds it and starts it behind HTTPS on
# <public-ip-with-dashes>.sslip.io. The only manual step afterwards is the API key:
#   ssh <user>@<ip> sudo hangup-set-key
package_update: true
packages: [git, curl]
write_files:
  - path: /usr/local/bin/hangup-set-key
    permissions: "0755"
    content: |
      #!/bin/sh
      # Prompts for the Nebius Token Factory key (input hidden) and restarts the API.
      set -e
      cd /opt/hang-up
      printf "Nebius Token Factory API key: "
      stty -echo; read KEY; stty echo; echo
      [ -n "$KEY" ] || { echo "No key entered"; exit 1; }
      grep -v '^NEBIUS_API_KEY=' .env > .env.tmp || true
      echo "NEBIUS_API_KEY=$KEY" >> .env.tmp
      mv .env.tmp .env && chmod 600 .env
      docker compose up -d
      echo "Done. Open https://$(grep '^DOMAIN=' .env | cut -d= -f2)"
runcmd:
  - curl -fsSL https://get.docker.com | sh
  - git clone https://github.com/CalebBaines1/hang-up.git /opt/hang-up
  # Use the build branch until it is merged, then main
  - cd /opt/hang-up && (git checkout claude/project-thread-xdq9ec 2>/dev/null || true)
  - cd /opt/hang-up && cp .env.example .env && chmod 600 .env
  - cd /opt/hang-up && IP=$(curl -fsS https://api.ipify.org) && sed -i "s/^DOMAIN=.*/DOMAIN=$(echo $IP | tr . -).sslip.io/" .env
  - cd /opt/hang-up && docker compose up -d --build > /var/log/hangup-build.log 2>&1
