# XcodeGen spec. Run `xcodegen` in this folder to create HangUp.xcodeproj.
name: HangUp
options:
  bundleIdPrefix: com.example.hangup
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your team here or pick it in Xcode under Signing & Capabilities.
    DEVELOPMENT_TEAM: ""
targets:
  HangUp:
    type: application
    platform: iOS
    sources:
      - path: HangUp
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.hangup
        CODE_SIGN_ENTITLEMENTS: HangUp/Resources/HangUp.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: HangUp/Resources/Info.plist
      properties:
        CFBundleDisplayName: Hang Up
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        # voip: PushKit wakes the app to ring scheduled calls. audio: keeps the call alive when the screen locks.
        UIBackgroundModes: [voip, audio]
        NSMicrophoneUsageDescription: Hang Up listens to you during practice calls so the AI caller can respond.
        NSSpeechRecognitionUsageDescription: Hang Up turns what you say on practice calls into text on your iPhone so the AI caller can respond.
        # Where the Hang Up server runs. Can also be changed in the app's Settings.
        HangUpServerURL: https://hang-up.onrender.com
